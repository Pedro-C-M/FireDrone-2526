version: "3.9"

networks:
  firedrone-network:
    driver: bridge

services:

  redis:
    image: redis:alpine
    container_name: firedrone-redis
    command: redis-server --port 5308
    networks:
      - firedrone-network
    ports:
      - "5308:5308"
    restart: unless-stopped

  central-backend:
    build:
      context: .
      dockerfile: src/CentralBackend/Dockerfile
    image: firedrone-central-backend
    container_name: firedrone-central-backend
    networks:
      - firedrone-network
    ports:
      - "5306:5306"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5306
      ControlBackend__Url: http://firedrone-control-backend:5307
      ConnectionStrings__Redis: firedrone-redis:5308,abortConnect=false
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  control-backend:
    build:
      context: .
      dockerfile: src/ControlBackend/Dockerfile
    image: firedrone-control-backend
    container_name: firedrone-control-backend
    networks:
      - firedrone-network
    ports:
      - "5307:5307"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5307
      CentralBackend__BaseUrl: http://firedrone-central-backend:5306
      RABBITMQ_HOST: 156.35.163.122
      RABBITMQ_USER: equipo3-777
      RABBITMQ_PASSWORD: shhh-777
      RABBITMQ_EXCHANGE: drone_exchange
      RABBITMQ_TOPIC: drone.#
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: src/CentralFrontend/Dockerfile
    image: firedrone-frontend
    container_name: firedrone-frontend
    networks:
      - firedrone-network
    ports:
      - "5305:5305"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5305
    restart: unless-stopped

  drone-1:
    build:
      context: .
      dockerfile: src/DroneController/Dockerfile
    image: firedrone-drone-controller
    container_name: firedrone-drone-1
    networks:
      - firedrone-network
    environment:
      RABBITMQ_HOST: 156.35.163.122
      RABBITMQ_USER: equipo3-777
      RABBITMQ_PASSWORD: shhh-777
      RABBITMQ_EXCHANGE: drone_exchange
    command: ["1", "DroneSimulator"]
    restart: unless-stopped

