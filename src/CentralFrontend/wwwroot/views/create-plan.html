<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Operation - FireDrone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="sidebar-brand">
                    🚁 FireDrone
                </a>
            </div>
            <div class="sidebar-nav">
                <a href="/index.html" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                    Dashboard
                </a>
                <a href="/views/create-plan.html" class="nav-link active">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
                    New Operation
                </a>
                <a href="/views/map.html" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" /></svg>
                    Live Map
                </a>
                <a href="/views/routes.html" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"> <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
                    Routes
                </a>
            </div>
            <div class="sidebar-footer">
                v1.0.0
            </div>
        </nav>

        <main class="main-content">
            <h2 class="page-title mb-4">Operations Center</h2>

            <div class="row">
                <div class="col-md-7">
                    <div class="card-box">
                        <h4 class="mb-3 text-primary">Create Flight Plan</h4>
                        <form action="javascript:void(0);" method="POST" onsubmit="addFlightPlan()">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="add-dronId" class="form-label">Select Drone</label>
                                    <select class="form-control" id="add-dronId" required>
                                        <option value="">Loading...</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="add-rutaId" class="form-label">Route ID</label>
                                    <input type="number" class="form-control" id="add-rutaId" placeholder="Ex: 1" required>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="add-estControlId" class="form-label">Station ID</label>
                                    <input type="number" class="form-control" id="add-estControlId" placeholder="Ex: 1">
                                </div>
                                <div class="col-md-6">
                                    <label for="add-startingPointId" class="form-label">Starting Point</label>
                                    <input type="number" class="form-control" id="add-startingPointId" placeholder="Ex: 1">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="add-startingTime" class="form-label">Start Time</label>
                                    <input type="datetime-local" class="form-control" id="add-startingTime" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="add-state" class="form-label">Initial Status</label>
                                    <select class="form-control" id="add-state" required>
                                        <option value="0">On Course</option>
                                        <option value="1">Completed</option>
                                        <option value="2">Cancelled</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Create Plan</button>
                        </form>
                    </div>
                </div>

                <div class="col-md-5">
                    <div class="card-box">
                        <h4 class="mb-3 text-success">Quick Assign</h4>
                        <p class="text-muted small">Re-assign a drone to an existing flight plan immediately.</p>
                        <form onsubmit="assignDronToPlan(); return false;">
                            <div class="mb-3">
                                <label for="assign-planId" class="form-label">Flight Plan ID</label>
                                <input type="number" class="form-control" id="assign-planId" placeholder="ID" required>
                            </div>
                            <div class="mb-3">
                                <label for="assign-droneId" class="form-label">Drone</label>
                                <select class="form-control" id="assign-droneId" required>
                                    <option value="">Loading...</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Assign Drone</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script type="module" src="/js/api.js"></script>
</body>
</html>
