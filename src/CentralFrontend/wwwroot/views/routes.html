<!doctype html>
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Routes Manager - FireDrone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/assets/css/site.css" />
    <style>
        /* Estilos específicos para esta vista */
        #map {
            height: 600px;
            width: 100%;
            border-radius: 8px;
            z-index: 1;
        }

        .route-row {
            cursor: pointer;
            transition: background 0.2s;
        }

            .route-row:hover {
                background-color: #f1f3f5;
            }

        .selected-row {
            background-color: #e7f1ff !important;
            border-left: 4px solid #0d6efd;
        }

        .badge-periodic {
            background-color: #6610f2;
        }
        /* Morado para periódicas */
        .badge-simple {
            background-color: #0d6efd;
        }
        /* Azul para simples */
    </style>
</head>
<body>
    <div class="dashboard-container">

        <nav class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="sidebar-brand">
                    🚁 FireDrone
                </a>
            </div>
            <div class="sidebar-nav">
                <a href="/index.html" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                    Dashboard
                </a>
                <a href="/views/create-plan.html" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
                    New Operation
                </a>
                <a href="/views/map.html" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" /></svg>
                    Live Map
                </a>
                <a href="/views/routes.html" class="nav-link active">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"> <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
                    Routes
                </a>
            </div>
            <div class="sidebar-footer">
                v1.0.0
            </div>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h2 class="page-title">Route Management</h2>
            </div>

            <div class="card-box mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1">📂 Import Routes (CSV)</h5>
                        <p class="text-muted small mb-0">Format: Name;Type;Lat;Lon;Height;Speed</p>
                    </div>
                    <form id="importForm" class="d-flex gap-2">
                        <input class="form-control form-control-sm" type="file" id="csvFile" accept=".csv" required>
                        <button type="submit" class="btn btn-sm btn-primary text-nowrap">⬆ Upload</button>
                    </form>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-lg-4">
                    <div class="card-box h-100">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Stored Routes</h5>
                            <button id="btnRefresh" class="btn btn-sm btn-outline-secondary">Refresh</button>
                        </div>
                        <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
                            <table class="table table-hover align-middle">
                                <thead class="table-light sticky-top">
                                    <tr>
                                        <th>ID/Name</th>
                                        <th>Type</th>
                                        <th class="text-end">View</th>
                                    </tr>
                                </thead>
                                <tbody id="routesTableBody">
                                    <tr><td colspan="3" class="text-center">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card-box h-100 p-0 overflow-hidden d-flex flex-column">
                        <div class="p-3 border-bottom bg-light d-flex justify-content-between">
                            <strong id="mapTitle">Select a route to visualize</strong>
                            <span id="routeInfo" class="badge bg-secondary">No selection</span>
                        </div>
                        <div id="map"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="/js/routes.js"></script>
</body>
</html>
