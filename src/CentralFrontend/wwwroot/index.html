<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - FireDrone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="sidebar-brand">
                    🚁 FireDrone
                </a>
            </div>
            <div class="sidebar-nav">
                <a href="/index.html" class="nav-link active">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                    Dashboard
                </a>
                <a href="/views/create-plan.html" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
                    New Operation
                </a>
                <a href="/views/map.html" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" /></svg>
                    Live Map
                </a>
                <a href="/views/routes.html" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"> <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>
                    Routes
                </a>
            </div>
            <div class="sidebar-footer">
                v1.0.0
            </div>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h2 class="page-title">Flight Plans Overview</h2>
                <a href="/views/create-plan.html" class="btn btn-primary">
                    + Create New Plan
                </a>
            </div>

            <div class="card-box">
                <div class="d-flex justify-content-between mb-3">
                    <h5 id="counter">Loading...</h5>
                    <button class="btn btn-sm btn-outline-secondary" onclick="getFlightPlans()">Refresh</button>
                </div>

                <div class="table-responsive">
                    <table id="flightplans_table" class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Drone</th>
                                <th>Route</th>
                                <th>Station</th>
                                <th>Start Time</th>
                                <th>End Time</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="flightplans_tbody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="editForm" class="card-box" style="display:none; border: 1px solid #ffc107; border-left: 5px solid #ffc107;">
                <h4 class="mb-3">Edit Flight Plan</h4>
                <form action="javascript:void(0);" onsubmit="updateFlightPlan()">
                    <input type="hidden" id="edit-id">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="edit-dronId" class="form-label">Drone</label>
                            <select class="form-control" id="edit-dronId" required>
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="edit-state" class="form-label">Status</label>
                            <select class="form-control" id="edit-state" required>
                                <option value="0">On Course</option>
                                <option value="1">Completed</option>
                                <option value="2">Cancelled</option>
                            </select>
                        </div>
                    </div>
                    <input type="hidden" id="edit-rutaId">
                    <input type="hidden" id="edit-estControlId">
                    <input type="hidden" id="edit-startingPointId">
                    <input type="hidden" id="edit-startingTime">
                    <input type="hidden" id="edit-endingTime">

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">Save Changes</button>
                        <button type="button" onclick="closeInput()" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>

        </main>
    </div>

    <template id="flightplan_row">
        <tr>
            <td class="fw-bold"></td>
            <td><span class="badge bg-light text-dark border"></span></td>
            <td></td>
            <td></td>
            <td class="small text-muted"></td>
            <td class="small text-muted"></td>
            <td></td>
            <td>
                <div class="btn-group-vertical btn-group-sm">
                    <div class="btn-group btn-group-sm mb-1">
                        <button class="btn btn-sm btn-success btn-resume" title="Resume from last position">▶️ Resume</button>
                        <button class="btn btn-sm btn-outline-success btn-restart" title="Start from beginning">🔄 Restart</button>
                    </div>
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-sm btn-outline-primary btn-edit" title="Edit">✏️</button>
                        <button class="btn btn-sm btn-outline-info btn-manual" title="Manual Mode">🎮</button>
                        <button class="btn btn-sm btn-outline-danger btn-stop" title="Stop">🛑</button>
                        <button class="btn btn-sm btn-outline-secondary btn-delete" title="Delete">🗑️</button>
                    </div>
                </div>
            </td>
        </tr>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script type="module" src="/js/api.js"></script>
    <script src="/js/site.js"></script>
</body>
</html>
